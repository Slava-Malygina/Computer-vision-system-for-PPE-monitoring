{% extends "base.html" %}

{% block extra_styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/analytics_style.css') }}">
{% endblock %}

{% block content %}
<div class="analytics-container">
    <div class="glass-panel">
        <div class="charts-section">
            <div class="charts-grid">
                <div class="chart-card">
                    <h3>Распределение по типам нарушений</h3>
                    <canvas id="chart-types"></canvas>
                </div>

                <div class="chart-card">
                    <h3>Динамика нарушений по дням</h3>
                    <canvas id="chart-daily"></canvas>
                </div>
            </div>
        </div>

        <div class="section-spacer"></div>
            <div class="filters-section">
                <div class="filters-area" id="filters-area">
                    <div class="filter-group filter-group-row">
                        <label>Период:</label>
                        <div class="period-buttons">
                            <label class="radio-label">
                                <input type="radio" name="period" value="7days"> 7 дней
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="period" value="30days"> 30 дней
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="period" value="3months"> 3 мес
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="period" value="year"> Год
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="period" value="custom" id="custom-period-radio"> Другое
                            </label>
                        </div>
                    </div>

                    <div class="filter-group filter-group-row" id="custom-date-range" style="display: none;">
                        <label>Свой период:</label>
                        <div class="date-range-wrapper">
                            <input type="date" id="date-from" class="date-input">
                            <span>—</span>
                            <input type="date" id="date-to" class="date-input">
                        </div>
                    </div>
                    <div class="filter-group camera-selector">
                        <label>По камере:</label>
                        <div class="dropdown-checkbox">
                            <button type="button" class="dropdown-btn" id="camera-dropdown-btn">
                                Выбрать камеры <span class="arrow">▼</span>
                            </button>
                            <div class="dropdown-content" id="camera-dropdown">
                                <label><input type="checkbox" value="rtsp://localhost:8554/stream1" checked> rtsp://localhost:8554/stream1</label>
                                <label><input type="checkbox" value="rtsp://localhost:8554/stream2" checked> rtsp://localhost:8554/stream2</label>
                                <label><input type="checkbox" value="rtsp://localhost:8554/stream3" checked> rtsp://localhost:8554/stream3</label>
                                <label><input type="checkbox" value="rtsp://localhost:8554/stream4" checked> rtsp://localhost:8554/stream4</label>

                                <label><input type="checkbox" value="other" checked id="other-cameras-checkbox"> Другое (веб-камера, видео и т.д.)</label>
                            </div>
                        </div>
                    </div>

                    <div class="filter-buttons">
                        <button id="apply-filters-analytics" class="btn-primary">Применить</button>
                    </div>
                </div>
            </div>

    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/analytics.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>document.addEventListener('DOMContentLoaded', function() {
        const urlParams = new URLSearchParams(window.location.search);
        let start_date = urlParams.get('start_date');
        let end_date = urlParams.get('end_date');
        const today = new Date();
        const sevenDaysAgo = new Date(today);
        sevenDaysAgo.setDate(today.getDate() - 7);

        if (!start_date) {
            start_date = sevenDaysAgo.toISOString().split('T')[0];
            document.getElementById('start_date').value = start_date;
        }
        if (!end_date) {
            end_date = today.toISOString().split('T')[0];
            document.getElementById('end_date').value = end_date;
        }

        const camera_ids = urlParams.getAll('camera_id');
        const violation_types = urlParams.getAll('violation_type');

        function buildApiUrl(baseUrl) {
            let url = baseUrl;
            const params = new URLSearchParams();
            if (camera_ids.length) camera_ids.forEach(c => params.append('camera_id', c));
            if (violation_types.length) violation_types.forEach(t => params.append('violation_type', t));
            if (start_date) params.append('start_date', start_date);
            if (end_date) params.append('end_date', end_date);
            const query = params.toString();
            if (query) url += '?' + query;
            return url;
        }

        let typesChart, dailyChart;

        async function loadCharts() {
            try {
                const typesResponse = await fetch(buildApiUrl('/api/stats/types'));
                const typesData = await typesResponse.json();
                const typesLabels = typesData.map(item => item.type);
                const typesCounts = typesData.map(item => item.count);

                if (typesChart) typesChart.destroy();
                const ctxTypes = document.getElementById('chart-types').getContext('2d');
                typesChart = new Chart(ctxTypes, {
                    type: 'pie',
                    data: {
                        labels: typesLabels,
                        datasets: [{
                            data: typesCounts,
                            backgroundColor: ['#ff6384', '#36a2eb', '#ffce56'],
                            hoverOffset: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { position: 'bottom' },
                            tooltip: { callbacks: { label: (ctx) => `${ctx.label}: ${ctx.raw} (${((ctx.raw / typesData.reduce((sum, i) => sum + i.count, 0)) * 100).toFixed(1)}%)` } }
                        }
                    }
                });

                const dailyResponse = await fetch(buildApiUrl('/api/stats/daily'));
                const dailyData = await dailyResponse.json();
                const dates = dailyData.map(item => item.date);
                const counts = dailyData.map(item => item.count);

                if (dailyChart) dailyChart.destroy();
                const ctxDaily = document.getElementById('chart-daily').getContext('2d');
                dailyChart = new Chart(ctxDaily, {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [{
                            label: 'Количество нарушений',
                            data: counts,
                            borderColor: '#3a7fff',
                            backgroundColor: 'rgba(58, 127, 255, 0.1)',
                            fill: true,
                            tension: 0.1,
                            pointBackgroundColor: '#3a7fff'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        scales: { y: { beginAtZero: true, title: { display: true, text: 'Количество' } } }
                    }
                });
            } catch (error) {
                console.error('Ошибка загрузки диаграмм:', error);
            }
        }

        const form = document.getElementById('analytics-filters');
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(form);
            const params = new URLSearchParams();
            for (let [key, value] of formData.entries()) {
                if (value) params.append(key, value);
            }
            window.location.search = params.toString();
        });

        document.getElementById('reset-analytics').addEventListener('click', function(e) {
            e.preventDefault();
            window.location.href = window.location.pathname;
        });

        loadCharts();
    });</script>

{% endblock %}
