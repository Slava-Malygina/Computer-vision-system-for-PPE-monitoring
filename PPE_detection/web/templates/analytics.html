{% extends "base.html" %}

{% block extra_styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/analytics_style.css') }}">
{% endblock %}

{% block content %}
<div class="analytics-container">
    <div class="glass-panel">
        <div class="charts-section">
            <div class="charts-grid">
                <div class="chart-card">
                    <h3>Распределение по типам нарушений</h3>
                    <canvas id="chart-types"></canvas>
                </div>

                <div class="chart-card">
                    <h3>Динамика нарушений по дням</h3>
                    <canvas id="chart-daily"></canvas>
                </div>
            </div>
        </div>

        <div class="section-spacer"></div>
        <div class="filters-section">
            <div class="filters-area" id="filters-area">

                <div class="section-title">
                    Настройки графиков
                </div>

                <div class="filter-group filter-group-row">
                    <label>Период:</label>
                    <div class="period-buttons">
                        <label class="radio-label">
                            <input type="radio" name="period" value="7days"> 7 дней
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="period" value="30days"> 30 дней
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="period" value="3months"> 3 мес
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="period" value="year"> Год
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="period" value="custom" id="custom-period-radio"> Другое
                        </label>
                    </div>
                </div>

                    <div class="filter-group filter-group-row" id="custom-date-range" style="display: none;">
                        <label>Свой период:</label>
                        <div class="date-range-row">
                            <input type="date" id="date-from" class="date-input">
                            <span>—</span>
                            <input type="date" id="date-to" class="date-input">
                        </div>
                    </div>

                <div class="filter-group filter-group-row">
                    <label>Группировка:</label>

                    <div class="period-buttons">

                        <label class="radio-label">
                            <input type="radio" name="grouping" value="day" checked>
                            Дни
                        </label>

                        <label class="radio-label">
                            <input type="radio" name="grouping" value="week">
                            Недели
                        </label>

                        <label class="radio-label">
                            <input type="radio" name="grouping" value="month">
                            Месяцы
                        </label>

                        <label class="radio-label">
                            <input type="radio" name="grouping" value="year">
                            Годы
                        </label>

                    </div>
                </div>


                <div class="filter-group camera-selector">
                    <label>По камере:</label>
                    <div class="dropdown-checkbox">
                        <button type="button" class="dropdown-btn" id="camera-dropdown-btn">
                            Выбрать камеры <span class="arrow">▼</span>
                        </button>
                        <div class="dropdown-content" id="camera-dropdown">
                            <div id="camera-list-loading">Загрузка камер...</div>
                        </div>
                    </div>
                </div>

                <div class="filter-group">
                    <label>Динамика</label>
                    <label>По нарушению :</label>
                    <div class="dropdown-checkbox">
                        <button type="button" class="dropdown-btn" id="violation-dropdown-btn">
                            Выбрать нарушения <span class="arrow">▼</span>
                        </button>
                        <div class="dropdown-content" id="violation-dropdown">
                            <label><input type="checkbox" value="Без каски" checked> Без каски</label>
                            <label><input type="checkbox" value="Без жилета" checked> Без жилета</label>
                            <label><input type="checkbox" value="Без перчаток" checked> Без перчаток</label>
                        </div>
                    </div>
                </div>


                <div class="filter-buttons">
                    <button id="apply-filters-analytics" class="btn-primary">Применить</button>
                </div>
            </div>
        </div>

        <div class="section-spacer"></div>

        <div class="export-section">
            <div class="filters-area export-area">

                <div class="section-title">
                    Экспорт
                </div>

                <div class="filter-group filter-group-row">
                    <label>Формат:</label>

            <div class="period-buttons">
                <label class="radio-label">
                    <input type="radio" name="export-format" value="xlsx" checked>
                    XLSX
                </label>

                <label class="radio-label">
                    <input type="radio" name="export-format" value="pdf">
                    PDF
                </label>

                <label class="radio-label">
                    <input type="radio" name="export-format" value="csv">
                    CSV
                </label>
            </div>
        </div>

        <div class="filter-group export-options-group">

            <label>Вид отчета:</label>

            <div class="export-checkboxes">

                <label class="glass-checkbox">
                    <input type="checkbox" id="full-report-checkbox" checked>
                    <span class="custom-checkbox"></span>
                    Полный
                </label>

                <label class="glass-checkbox">
                    <input type="checkbox" id="apply-journal-filters-checkbox">
                    <span class="custom-checkbox"></span>
                    Применить фильтры
                </label>

            </div>
            <div
                class="records-limit-wrapper"
                id="records-limit-wrapper"
                style="display: none;"
            >

                <label>Количество записей:</label>

                <div class="records-input-box">

                    <input
                        type="number"
                        id="records-limit-input"
                        class="records-limit-input"
                        min="1"
                        max="100000"
                        value="100"
                    >

                    <div class="records-spinner">
                        <button type="button" id="records-up-btn">▲</button>
                        <button type="button" id="records-down-btn">▼</button>
                    </div>

                </div>
            </div>
        </div>

        <div class="active-filters-box" id="active-filters-box" style="display: none;">

            <div class="active-filters-title">
                Действующие параметры
            </div>

            <div class="active-filters-list" id="active-filters-list">

            </div>
        </div>



        <div class="filter-buttons">
            <button id="download-report-btn" class="btn-primary">
                Скачать
            </button>
        </div>

    </div>
</div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/analytics.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>


{% endblock %}
