<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система контроля СИЗ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_styles %}{% endblock %}
</head>
<body>
    <div class="container">
        <div class="tab-bar">
            <button
                id="journal-tab-btn"
                class="tab-btn {% if active_tab == 'journal' %}active{% endif %}"
            >
                Журнал нарушений
            </button>
            <button class="tab-btn {% if active_tab == 'analytics' %}active{% endif %}" onclick="location.href='/analytics'">
                Аналитика и отчёты
            </button>
        </div>

        {% block content %}{% endblock %}
    </div>

    <script>

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
            });
        });

        const journalBtn = document.getElementById('journal-tab-btn');

        if (journalBtn) {
            journalBtn.addEventListener('click', function() {

                const savedFilters = localStorage.getItem('journalFilters');

                if (savedFilters) {
                    window.location.href = '/journal?' + savedFilters;
                } else {
                    window.location.href = '/journal';
                }
            });
        }
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
